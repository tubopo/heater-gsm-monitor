name: 🚦 Build Verification

on:
  push:

jobs:
  esphome:
    name: Verify ESPHome Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install -r esphome/requirements.txt

      - name: Set ESPHome test secrets
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Validate production config
        working-directory: esphome
        run: esphome config heater-gsm-monitor.yaml

      - name: Compile production firmware
        working-directory: esphome
        run: esphome compile heater-gsm-monitor.yaml

      - name: Compile debug firmware
        working-directory: esphome
        run: esphome compile heater-gsm-monitor.debug.yaml

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware
          path: esphome/.esphome/build/*/.pioenvs/*/firmware.bin

      - name: Print Build Summary
        if: success()
        run: |
          echo "✅ ESPHome builds successful"
          find esphome/.esphome/build -name firmware.bin -exec ls -lh {} \;
